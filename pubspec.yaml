name: scamshield_ai
description: ScamShield AI — bảo vệ người dùng khỏi cuộc gọi và tin nhắn lừa đảo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & Services
  provider: ^6.1.5
  supabase_flutter: ^2.9.0
  shared_preferences: ^2.5.3
  http: ^1.4.0
  url_launcher: ^6.3.1

  # Background & Hardware
  flutter_tts: ^4.2.3
  telephony: ^0.2.0
  permission_handler: ^11.4.0
  flutter_background_service: ^5.1.0
  phone_state: 1.0.4
  flutter_local_notifications: ^18.0.1

  # UI & Utilities
  lucide_icons: ^0.257.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true